<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <!--
      Establish the network connections early.

      OMDb API:
      Used to retrieve movie details.

      Amazon media CDN:
      OMDb poster URLs commonly point here.
    -->
    <link rel="preconnect" href="https://www.omdbapi.com" />
    <link rel="dns-prefetch" href="//www.omdbapi.com" />

    <link
      rel="preconnect"
      href="https://m.media-amazon.com"
      crossorigin
    />
    <link rel="dns-prefetch" href="//m.media-amazon.com" />

    <title>Movie Explorer</title>
  </head>

  <body>
    <div id="root"></div>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
